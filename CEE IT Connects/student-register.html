<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEE IT Connects - Student Register</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="stylesheet" href="/CSS/student-register.css">
</head>
<body>

    <div id="loading-screen">
        <img src="/Sources/CEE IT Connects Logo.png" alt="Logo" class="loading-logo">
    </div>

    <div class="container-fluid login-container">
        <div class="row h-100">
            <div class="col-md-5 p-0 left-panel"></div>

            <div class="col-md-7 right-panel">
                
                <img src="/Sources/CEE IT Connects Logo.png" alt="CEE IT Logo" class="logo-img">
                <h2 class="login-title">CEE IT CONNECTS</h2>
                <h3 class="login-subtitle">Register</h3>

                <form class="form-wrapper">
                    
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Full Name (First Name, Last Name)">
                    </div>

                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Student ID Number">
                    </div>

                    <div class="mb-3">
                        <select class="form-select" required>
                            <option value="" disabled selected>Program</option>
                            <option value="IT">Information Technology</option>
                            <option value="EE">Electrical Engineering</option>
                            <option value="CE">Civil Engineering</option>
                        </select>
                    </div>

                    <div class="row mb-3">
                        <div class="col-6">
                            <select class="form-select" required>
                                <option value="" disabled selected>Year Level</option>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <select class="form-select" id="sectionSelect" required>
                                <option value="" disabled selected>Section</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <input type="file" id="cor-upload" hidden>
                        <label for="cor-upload" class="file-upload-label">
                            <span id="file-label-text">Upload Certificate of Registration</span>
                            <i class="fa fa-download"></i>
                        </label>
                    </div>

                    <div class="mb-3">
                        <input type="password" class="form-control" placeholder="Password (Use 8 or more characters)">
                    </div>

                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Contact Number">
                    </div>

                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Email Address">
                    </div>

                    <div class="terms-text">
                        By creating an account, you agree to the <a href="#" class="terms-link">Terms of Use</a> and <a href="#" class="terms-link">Privacy Policy</a>
                    </div>

                    <button type="button" class="btn-login mt-3" onclick="window.location.href='student-welcome.html'">
                    Create an account
                    </button>                    
                    
                    <div class="register-text mt-3">
                        Already have an account? <a href="student-login.html" class="register-link">Sign in</a>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="/JS/student-register.js"></script>
</body>
</html>
